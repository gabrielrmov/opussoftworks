<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Opus SoftWorks — Primeiro post</title>
<style>
  @font-face{font-family:"Exo 2";font-weight:400;src:url(fonts/exo400.ttf)}
  @font-face{font-family:"Exo 2";font-weight:600;src:url(fonts/exo600.ttf)}
  @font-face{font-family:"Exo 2";font-weight:700;src:url(fonts/exo700.ttf)}
  @font-face{font-family:"Rubik";font-weight:400;src:url(fonts/rubik400.ttf)}
  @font-face{font-family:"Rubik";font-weight:500;src:url(fonts/rubik500.ttf)}
  :root{--bg-deep:#0b0b0b;--accent:#ff6039;--accent-hi:#ffa98f;--accent-lo:#7a1d08;--symbol:url(opus-symbol-coral.png)}
  :root.azul{--bg-deep:#000;--accent:#3b3dff;--accent-hi:#9fa4ff;--accent-lo:#0a0b66;--symbol:url(opus-symbol-blue.png)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;background:#111}
  .post{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;font-family:"Rubik",sans-serif;text-align:center;
    background:radial-gradient(760px 620px at 50% 30%, #1b1b1b 0%, transparent 70%),linear-gradient(180deg,#141414,var(--bg-deep))}
  .grain{position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;pointer-events:none;z-index:9}
  .ring{position:absolute;left:120px;top:150px;width:840px;height:840px;border-radius:50%;border:1.5px solid rgba(255,255,255,.14);z-index:1}
  .ring.b{left:20px;top:50px;width:1040px;height:1040px;border-color:rgba(255,255,255,.07)}

  .top{position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center;align-items:center;gap:26px;z-index:6}
  .logo{display:flex;align-items:center;gap:12px;font-family:"Exo 2",sans-serif;font-size:44px;letter-spacing:-.03em;line-height:1}
  .logo i{display:block;width:70px;height:48px;background:var(--symbol) center/contain no-repeat}
  .logo b{font-weight:700}.logo span{font-weight:400;color:var(--accent)}
  .tag{display:flex;align-items:center;gap:12px;height:62px;padding:0 28px;border-radius:40px;border:1.5px solid rgba(255,255,255,.22);font-size:22px;color:#e9e9e9;
    background:rgba(255,255,255,.03)}
  .tag svg{flex:none}

  h1{position:absolute;left:0;right:0;top:280px;z-index:6;font-family:"Exo 2",sans-serif;font-weight:600;letter-spacing:-.045em;line-height:1}
  h1 .l1{display:block;font-size:120px}
  h1 .l2{position:relative;display:inline-block;margin-top:22px;font-size:98px;color:var(--accent)}
  h1 .l2 svg{position:absolute;left:-44px;top:-44px;width:calc(100% + 88px);height:calc(100% + 88px);overflow:visible}
  .sub{position:absolute;left:0;right:0;top:640px;z-index:6;font-size:35px;line-height:1.35;font-weight:400;color:#f1f1f1;letter-spacing:-.01em}
  .cta{position:absolute;left:50%;top:790px;transform:translateX(-50%);z-index:6;white-space:nowrap;height:92px;padding:0 54px;border-radius:50px;
    border:1.5px solid rgba(255,255,255,.28);font-size:31px;line-height:89px;background:rgba(0,0,0,.35)}
  .cta b{font-weight:500;color:var(--accent)}

  .fan{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
  .glow{position:absolute;left:0;right:0;bottom:0;height:520px;z-index:3;pointer-events:none;
    background:radial-gradient(520px 320px at 40% 100%,var(--accent-hi),transparent 70%),radial-gradient(760px 420px at 40% 100%,var(--accent),transparent 72%);
    mix-blend-mode:screen;opacity:.9}
</style>
</head>
<body>
<div class="post">
  <svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .6  0 0 0 0 .6  0 0 0 0 .6  0 0 0 .5 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="ring b"></div><div class="ring"></div>

  <div class="top">
    <div class="logo"><i></i><div><b>Opus</b><span>SoftWorks</span></div></div>
    <div class="tag">
      <svg width="26" height="26" viewBox="0 0 52 52" fill="var(--accent)"><path d="M20 4 L24.5 17.5 L38 22 L24.5 26.5 L20 40 L15.5 26.5 L2 22 L15.5 17.5Z"/><path d="M39 28 L41.7 36.3 L50 39 L41.7 41.7 L39 50 L36.3 41.7 L28 39 L36.3 36.3Z"/></svg>
      Nosso primeiro post
    </div>
  </div>

  <h1>
    <span class="l1">Muito prazer,</span>
    <span class="l2">Opus SoftWorks.
      <svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M6 62 C2 30 30 8 62 8 C90 8 99 30 94 54 C88 82 55 94 28 90 C12 88 5 76 7 66" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    </span>
  </h1>
  <p class="sub">Transformamos ideias em software:<br>sites, aplicativos, SaaS e micro-SaaS.</p>
  <div class="cta">Siga e <b>acompanhe a jornada.</b></div>

  <div class="fan" id="fan"></div>
  <div class="glow"></div>
</div>
<script type="module">
  import * as THREE from './lib/three.module.js';
  const root=document.documentElement;
  if(location.search.includes('azul')) root.classList.add('azul');
  const css=n=>getComputedStyle(root).getPropertyValue(n).trim();
  const accent=new THREE.Color(css('--accent')), hi=new THREE.Color(css('--accent-hi')), lo=new THREE.Color(css('--accent-lo'));

  const W=1080,H=1350;
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  renderer.setPixelRatio(1); renderer.setSize(W,H);
  renderer.toneMapping=THREE.NoToneMapping;
  renderer.setClearColor(0x000000,0);
  document.getElementById('fan').appendChild(renderer.domElement);

  const scene=new THREE.Scene();
  const fov=28, camZ=(H/2)/Math.tan(THREE.MathUtils.degToRad(fov/2));
  const camera=new THREE.PerspectiveCamera(fov,W/H,10,6000);
  camera.position.set(W/2,-H/2,camZ);              // y para baixo => usamos y negativo
  camera.lookAt(W/2,-H/2,0);

  // ambiente: faixas de luz para criar os reflexos do vidro
  const envScene=new THREE.Scene(); envScene.background=new THREE.Color(0x050505);
  const strip=(c,k,w,h,x,y,z)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c.clone().multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);envScene.add(m);};
  strip(new THREE.Color(1,1,1),6,3,30,-14,6,6);
  strip(new THREE.Color(1,1,1),3,2,30,14,4,8);
  strip(hi,6,6,20,0,-12,6);
  strip(accent,5,30,6,0,-6,-10);
  strip(accent,4,4,30,-8,0,-12);
  strip(new THREE.Color(1,1,1),2,30,3,0,16,0);
  const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(envScene,0.02).texture;

  // lâmina de vidro (retângulo arredondado extrudado com chanfro)
  const sw=34, sh=900, r=17;
  const shape=new THREE.Shape();
  shape.moveTo(-sw/2,-sh/2+r); shape.lineTo(-sw/2,sh/2-r); shape.absarc(0,sh/2-r,sw/2,Math.PI,0,true);
  shape.lineTo(sw/2,-sh/2+r); shape.absarc(0,-sh/2+r,sw/2,0,Math.PI,true);
  const geo=new THREE.ExtrudeGeometry(shape,{depth:20,bevelEnabled:true,bevelThickness:9,bevelSize:8,bevelSegments:6,curveSegments:24});
  geo.translate(0,0,-13);
  const mat=new THREE.MeshPhysicalMaterial({color:new THREE.Color(0x0a0505).lerp(accent,.12),metalness:.85,roughness:.22,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.3});

  const step=58, group=new THREE.Group(); scene.add(group);
  for(let x=-120;x<=1200;x+=step){
    const dx=x-500, top=1045+(dx*dx)*(160/500/500);
    const lean=THREE.MathUtils.degToRad(17-(dx/500)*7);
    const m=new THREE.Mesh(geo,mat);
    // topo da lâmina em (x, top); a lâmina gira em torno do próprio topo
    const piv=new THREE.Group(); piv.position.set(x,-top,-Math.abs(dx)*0.18);
    piv.rotation.z=-lean; piv.rotation.y=(dx/500)*0.35;
    m.position.y=-sh/2+r; piv.add(m); group.add(piv);
  }

  // luzes: brilho da base e brilho de borda
  const base=new THREE.PointLight(hi,9e5,0,2); base.position.set(430,-H-60,260); scene.add(base);
  const base2=new THREE.PointLight(accent,3e5,0,2); base2.position.set(900,-H+40,200); scene.add(base2);
  const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(-400,200,600); scene.add(key);

  renderer.render(scene,camera);
  document.body.dataset.ready='1';
</script>
</body>
</html>
