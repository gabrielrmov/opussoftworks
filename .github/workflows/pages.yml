name: Deploy to GitHub Pages

on:
  push:
    branches: [redesign]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Só repassa ao build as variáveis públicas do Supabase se forem válidas (URL do projeto +
      # Publishable key). Uma chave secreta colada na variável errada NÃO vai para o site.
      - name: Validar variáveis públicas do Supabase
        env:
          URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/preparar-env-supabase.mjs
      - run: pnpm build
      - run: pnpm check:painel-seo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
