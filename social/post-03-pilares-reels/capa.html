<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Opus SoftWorks · Post 3 · Capa do Reels</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../assets/base.css">
<style>
  /* 9:16. Zonas seguras do Reels: evitar 250px no topo e 340px na base */
  .slide{height:1920px}
  .chips{display:flex;flex-direction:column;gap:24px;margin-top:64px}
  .chip{display:flex;align-items:center;gap:32px;border-radius:28px;padding:34px 48px;background:#232323}
  .chip .n{font-family:'Exo 2';font-weight:700;font-size:56px;color:var(--coral);width:84px}
  .chip .t{font-family:'Exo 2';font-weight:700;font-size:72px;letter-spacing:-0.025em}
  .chip.hl{background:var(--coral)}
  .chip.hl .n,.chip.hl .t{color:#fff}
  .tag{display:inline-block;background:var(--coral);color:#fff;font-family:'Rubik';font-weight:600;font-size:26px;letter-spacing:.16em;text-transform:uppercase;padding:14px 28px;border-radius:999px}
</style>
</head>
<body>
<section class="slide dark" id="capa" style="padding-top:290px">
  <img class="sym" src="../assets/simbolo-coral.png" style="width:1100px;right:-440px;top:-60px;transform:rotate(-8deg);opacity:.95">
  <div style="position:relative"><span class="tag">Reels · 30 segundos</span></div>
  <h1 style="font-size:124px;margin-top:150px;position:relative">Os 3 pilares<br>da <span class="accent">Opus</span><br>SoftWorks</h1>
  <div class="chips">
    <div class="chip"><div class="n">01</div><div class="t">Entrega</div></div>
    <div class="chip"><div class="n">02</div><div class="t">Responsabilidade</div></div>
    <div class="chip"><div class="n">03</div><div class="t">Assertividade</div></div>
  </div>
  <div class="foot" style="bottom:360px"><div class="logo"><b>Opus</b><span>SoftWorks</span></div><div class="pg">@opussoftworks</div></div>
</section>
</body>
</html>
