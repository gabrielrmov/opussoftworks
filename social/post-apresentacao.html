<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Opus Softworks — Post de apresentação</title>
<style>
  @font-face{font-family:"Space Grotesk";font-weight:500;src:url(fonts/sg500.ttf)}
  @font-face{font-family:"Space Grotesk";font-weight:600;src:url(fonts/sg600.ttf)}
  @font-face{font-family:"Inter";font-weight:500;src:url(fonts/inter500.ttf)}
  /* Troque aqui a paleta quando a identidade oficial da Opus estiver definida */
  :root{
    --bg:#0c0c14;
    --card:#171721;
    --ink:#ededf3;
    --muted:#c3c3cc;
    --accent:#5266eb;
    --accent-hi:#9aa8ff;
    --accent-lo:#1b2160;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;background:var(--bg)}
  .post{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:"Space Grotesk",sans-serif;color:var(--ink);
    background:
      radial-gradient(900px 600px at 50% 0%, #1d1d2b 0%, transparent 70%),
      radial-gradient(900px 500px at 70% 105%, rgba(82,102,235,.28), transparent 70%),
      var(--bg);}
  .grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;pointer-events:none;z-index:9}

  /* header */
  .head{position:absolute;left:112px;right:112px;top:78px;display:flex;align-items:center;justify-content:space-between;
    padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.18);z-index:5}
  .brand{display:flex;align-items:center;gap:12px;font-size:30px;letter-spacing:.02em}
  .brand b{font-weight:600;letter-spacing:.14em}
  .brand span{font-weight:400;color:var(--muted);letter-spacing:.02em;font-size:24px}
  .tiny{font-family:Inter,sans-serif;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#e9e9f2;line-height:1.7}
  .tiny.r{text-align:right}

  /* card */
  .card{position:absolute;left:233px;top:236px;width:614px;height:700px;border-radius:64px;
    background:linear-gradient(180deg,#1b1b27,#15151f);
    box-shadow:0 0 0 1px rgba(255,255,255,.04) inset, 0 40px 90px rgba(0,0,0,.55);z-index:5}
  .bars{position:absolute;left:93px;top:62px;display:flex;gap:26px}
  .bars i{display:block;height:4px;border-radius:4px;background:#e9e9f2}
  .bars i:nth-child(1){width:94px}.bars i:nth-child(2){width:94px;background:var(--accent)}.bars i:nth-child(3){width:94px}
  h1{position:absolute;left:93px;top:132px;font-weight:500;font-size:98px;line-height:1.02;letter-spacing:-.045em}
  h1 em{font-style:normal;color:var(--accent)}
  .pill{position:absolute;left:93px;bottom:70px;right:93px;height:108px;border-radius:30px;background:#0d0d14;
    display:flex;align-items:center;gap:22px;padding:0 28px;font-size:23px;line-height:1.3;white-space:nowrap;letter-spacing:-.01em}
  .pill b{font-weight:600;color:var(--accent)}
  .pill svg{flex:none}

  /* fan of glass blades */
  .fan{position:absolute;left:0;top:0;width:1080px;height:1350px;z-index:2;pointer-events:none}
  .blade{position:absolute;left:0;top:0;border-radius:40px;transform-origin:0 0;
    background:
      linear-gradient(90deg, rgba(8,10,28,.95) 0%, var(--accent-lo) 14%, var(--accent) 40%, var(--accent-hi) 52%, var(--accent) 62%, var(--accent-lo) 86%, rgba(8,10,28,.95) 100%);
    -webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.9) 35%,transparent 100%);
            mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.9) 35%,transparent 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .floor{position:absolute;left:0;right:0;bottom:0;height:300px;z-index:3;
    background:linear-gradient(to top, rgba(154,168,255,.55), rgba(82,102,235,.25) 40%, transparent);mix-blend-mode:screen}
  .foot{position:absolute;left:0;right:0;bottom:44px;text-align:center;z-index:6;font-family:Inter,sans-serif;font-size:15px;
    letter-spacing:.32em;text-transform:uppercase;color:#fff;font-weight:500;text-shadow:0 2px 12px rgba(0,0,40,.6)}
</style>
</head>
<body>
<div class="post">
  <svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

  <div class="head">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="12.5" stroke="#ededf3" stroke-width="5"/><path d="M17 4.5 A12.5 12.5 0 0 1 29.5 17" stroke="#5266eb" stroke-width="5" stroke-linecap="round"/></svg>
      <b>OPUS</b><span>softworks</span>
    </div>
    <div class="tiny r">Sistemas. Sites. Automação.<br>Software sob medida.</div>
  </div>

  <div class="fan" id="fan"></div>
  <div class="floor"></div>

  <div class="card">
    <div class="bars"><i></i><i></i><i></i></div>
    <h1>Prazer,<br>somos a<br><em>Opus.</em></h1>
    <div class="pill">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="#5266eb"><path d="M20 4 L24.5 17.5 L38 22 L24.5 26.5 L20 40 L15.5 26.5 L2 22 L15.5 17.5Z"/><path d="M39 28 L41.7 36.3 L50 39 L41.7 41.7 L39 50 L36.3 41.7 L28 39 L36.3 36.3Z"/></svg>
      <div>Conheça a <b>Opus Softworks</b>.<br>Tecnologia <b>sob medida.</b></div>
    </div>
  </div>

  <div class="foot">Bem-vindo ao nosso perfil</div>
</div>
<script>
  // leque de lâminas de vidro, irradiando de um ponto abaixo do canvas
  const fan=document.getElementById('fan');
  const cx=720, cy=1720, R=470, L=330, W=64, N=34;
  for(let i=0;i<N;i++){
    const a=-178+ (i/(N-1))*160;           // graus
    const d=document.createElement('div');
    d.className='blade';
    d.style.width=W+'px'; d.style.height=L+'px';
    d.style.transform=`translate(${cx}px,${cy}px) rotate(${a+90}deg) translate(${-W/2}px,${-(R+L)}px)`;
    fan.appendChild(d);
  }
</script>
</body>
</html>
