<!doctype html>

<title>Opus SoftWorks · Post 2 · O problema</title>

<style>
  .stack{display:flex;flex-direction:column;align-items:stretch;margin-top:56px}

  .gap .tx{font-family:'Rubik';font-weight:500;font-size:26px;color:var(--coral);letter-spacing:.04em}
  .you{margin-top:28px;display:flex;align-items:center;gap:28px;border:4px solid var(--coral);border-radius:28px;padding:30px 44px}

    <div class="you"><div><div class="t">E quem repassa o recado? <span class="accent">Você.</span></div><div class="d">Resultado não é sorte. É entrega.</div></div></div>
  </div>
  <div class="foot"><div class="logo"><b>Opus</b><span>SoftWorks</span></div><div class="pg">@opussoftworks</div></div>
