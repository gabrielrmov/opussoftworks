<!doctype html>

<style>

<section class="slide tall" id="capa">

  <div class="pr glass" style="top:1330px"><div class="n">02</div><div class="t" style="font-size:64px">Responsabilidade</div></div>
  <div class="pr glass" style="top:1470px;border-color:rgba(255,96,57,.85)"><div class="n">03</div><div class="t accent">Assertividade</div></div>
